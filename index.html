<!DOCTYPE html>
<html>
<head>
  <title>Water Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #e0f7fa; }
    h1 { color: #00796b; }
    #count { font-size: 60px; color: #004d40; margin: 20px; }
    button { padding: 15px 30px; font-size: 18px; background-color: #00897b; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
    button:hover { background-color: #00695c; }
  </style>
</head>
<body>
  <h1>Daily Water Tracker</h1>
  <p>Glasses of water drunk today:</p>
  <div id="count">0</div>
  <button onclick="addGlass()">Drink a Glass (+1)</button>
  <button onclick="resetCount()">Reset</button>

  <script>
    let glasses = 0;
    function addGlass() {
      glasses++;
      document.getElementById('count').innerText = glasses;
    }
    function resetCount() {
      glasses = 0;
      document.getElementById('count').innerText = glasses;
    }
  </script>
</body>
</html>
